<script>
// All data stays in this page. Provider capabilities below are fixtures, not integrations.
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const variants={A:'Project Library tab',B:'Card chat + picker',C:'Library dock'};
let uid=20, timer;
function picture(title,color){const c=document.createElement('canvas');c.width=480;c.height=270;const x=c.getContext('2d');x.fillStyle=color;x.fillRect(0,0,480,270);x.fillStyle='#ffffff20';x.beginPath();x.arc(370,130,90,0,7);x.fill();x.fillStyle='#fff';x.font='bold 36px Arial';x.fillText(title,30,105);x.font='18px Arial';x.fillText('THUMBNAIL CONCEPT · SOURCE',30,220);return c.toDataURL('image/png')}
const thumbnails={logo:picture('MA / STUDIO','#3b355b'),desk:picture('LESS GEAR.','#274455'),light:picture('BETTER LIGHT.','#594732')};
function seed(){return {variant:new URLSearchParams(location.search).get('variant')||'C',folder:'thumbs',search:'',picker:false,previewOpen:false,primaryProvider:'codex-tools',provider:'codex-tools',temporary:false,prompt:'Develop three thumbnail directions for this YouTube video. Use the script for the story and the thumbnail folder for visual references.',selections:[],submissions:[],copies:[],drafts:{},lastEvent:'Opened prototype',folders:[{id:'scripts',name:'Scripts',parent:'root'},{id:'thumbs',name:'Thumbnails',parent:'root'},{id:'refs',name:'References',parent:'thumbs'},{id:'brand',name:'Brand',parent:'root'},{id:'empty',name:'Next episode',parent:'root'}],assets:[
 {id:'script',name:'youtube-script.md',folder:'scripts',kind:'doc',versions:[{n:1,content:'# A studio that fits on a desk\n\nHook: You do not need a bigger room. You need a better setup.\n\n1. Clear the desk\n2. Shape the light\n3. Record the first take',note:'Written in Frameboard'},{n:2,content:'# A studio that fits on a desk\n\nHook: I built a tiny studio for $200. Here is what actually mattered.\n\n1. Before / after\n2. Light beats another camera\n3. Audio test\n\nCTA: Show me your desk setup.',note:'Saved a stronger opening'},{n:3,content:'# A studio that fits on a desk\n\nHook: This entire YouTube studio fits on a desk. The camera was the least important part.\n\n## The story\n- Show the cramped desk before the change.\n- Spend $80 on lighting, $70 on audio, $50 on a background.\n- A/B the result using the same camera.\n\n## Thumbnail promise\nA visible before-and-after. Simple shapes. One clear focal point.\n\n## Closing\nTry one improvement before buying another camera.',note:'Current saved script'}]},
 {id:'brief',name:'thumbnail-brief.md',folder:'thumbs',kind:'doc',versions:[{n:1,content:'# Thumbnail brief\n\nAudience: creators recording in small rooms.\nPromise: a practical improvement, not an expensive shopping list.\n\nKeep text to three words. Use the logo only when it helps.\nCompare a cool desk shot and a warm lighting shot.',note:'Pasted in Frameboard'}]},
 {id:'logo',name:'logo.png',folder:'thumbs',kind:'image',versions:[{n:1,content:thumbnails.logo,note:'Uploaded original'}]},
 {id:'desk',name:'desk-before.png',folder:'refs',kind:'image',versions:[{n:1,content:thumbnails.desk,note:'Uploaded original'}]},
 {id:'light',name:'lighting-reference.png',folder:'refs',kind:'image',versions:[{n:1,content:thumbnails.light,note:'Uploaded original'}]},
 {id:'brand-logo',name:'logo.png',folder:'brand',kind:'image',versions:[{n:1,content:thumbnails.logo,note:'Separate asset; another folder'}]},
 {id:'brand-notes',name:'voice-and-style.md',folder:'brand',kind:'text',versions:[{n:1,content:'# Channel voice\n\nPractical, curious, specific. No miracle gear claims.\nShow the result before explaining the setup.',note:'Uploaded Markdown'}]},
 {id:'zip',name:'thumbnail-sources.zip',folder:'thumbs',kind:'file',versions:[{n:1,content:'Disposable archive fixture. A production download would contain the retained original ZIP bytes.',note:'Demo original; ZIP contents are not previewed',size:8400000,unknown:true}]}
 ]}}
function freshSeed(){const s=seed();s.assets.forEach(a=>a.versions.forEach(v=>v.kind=a.kind));return s}
let S=freshSeed();if(!variants[S.variant])S.variant='C';
const folder=id=>S.folders.find(f=>f.id===id),asset=id=>S.assets.find(a=>a.id===id),current=a=>a.versions.at(-1);
function folderPath(id){if(id==='root')return '';const f=folder(id);return f?folderPath(f.parent)+f.name+'/':'[missing]/'}
const assetPath=a=>folderPath(a.folder)+a.name;
function under(id,parent){if(id===parent)return true;if(id==='root')return false;const f=folder(id);return f?under(f.parent,parent):false}
function folderAssets(id){return S.assets.filter(a=>!a.removed&&under(a.folder,id)).sort((a,b)=>assetPath(a)<assetPath(b)?-1:assetPath(a)>assetPath(b)?1:0)}
function selectionName(s){const o=s.kind==='folder'?folder(s.id):asset(s.id);return o?(s.kind==='folder'?folderPath(o.id):assetPath(o)):'Missing selection'}
function expand(){const files=[],unresolved=[],map=new Map;S.selections.forEach((s,index)=>{const o=s.kind==='folder'?folder(s.id):asset(s.id);if(!o||o.removed){unresolved.push(s);return}const items=s.kind==='folder'?folderAssets(s.id):[o];items.forEach(a=>{const origin={kind:s.kind,id:s.id,label:selectionName(s),selection:index+1};if(map.has(a.id)){map.get(a.id).origins.push(origin);return}const f={id:a.id,name:a.name,path:assetPath(a),version:current(a).n,kind:a.kind,mime:current(a).mime,content:current(a).content,original:current(a).original,size:current(a).size??String(current(a).content).length,missing:current(a).missing,unknown:current(a).unknown,origins:[origin]};map.set(a.id,f);files.push(f)})});return {files,unresolved}}
const providers={'codex-tools':'Codex · tools available','codex-direct':'Codex · tools off','claude-tools':'Claude · tools available','claude-direct':'Claude · tools off'};
function route(f,target=S.provider){if(f.missing)return {error:'Retained bytes are missing. Restore the bytes or remove this selection.'};if(['doc','text'].includes(f.kind)){if(f.size>120000)return {error:'Text exceeds the demo target’s 120 KB direct-input limit. Supply a smaller representation or change target.'};return {method:'Direct text',detail:'Labeled reference content'}}if(f.kind==='image'&&(!f.mime||['image/png','image/jpeg','image/webp','image/gif'].includes(f.mime)))return {method:'Direct image',detail:'Labeled image input'};if(target.endsWith('tools'))return {method:'Available through tools',detail:'Independent workspace copy of the original; format comprehension is not guaranteed.'};return {error:f.name.endsWith('.pdf')?'No verified native PDF route in this prototype. Enable usable tools or choose a verified adapter.':'No usable input route with tools off. Enable tools, remove this selection, or supply text/images.'}}
function preflight(){const e=expand();const total=new TextEncoder().encode(S.prompt).length+e.files.filter(f=>['doc','text'].includes(f.kind)).reduce((n,f)=>n+f.size,0);const totalErrors=total>120000&&e.files.every(f=>!route(f).error)?['Combined text exceeds the demo target’s 120 KB input limit. Remove sources, supply a smaller representation, or change target.']:[];return {...e,errors:[...totalErrors,...e.unresolved.map(s=>selectionName(s)+' was removed. Remove or correct this selection.'),...e.files.map(f=>route(f).error?f.path+': '+route(f).error:null).filter(Boolean)]}}
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,4400)}
function event(message){S.lastEvent=message;render();toast(message)}
function pick(kind,id){if(!S.selections.some(s=>s.kind===kind&&s.id===id))S.selections.push({kind,id});event(kind==='folder'?'Folder selected. The next Send includes its current recursive contents.':'Asset selected for the next Send.')}
function togglePick(kind,id,checked){if(checked)pick(kind,id);else{S.selections=S.selections.filter(s=>!(s.kind===kind&&s.id===id));event('Selection removed from future submissions.')}}
function selected(kind,id){return S.selections.some(s=>s.kind===kind&&s.id===id)}
function crumbs(){const chain=[];let id=S.folder;while(id!=='root'){const f=folder(id);if(!f)break;chain.unshift(f);id=f.parent}return `<div class="crumbs"><button class="plain" data-nav="root">Library</button>${chain.map(f=>`<span class="muted">/</span><button class="plain" data-nav="${f.id}">${esc(f.name)}</button>`).join('')}</div>`}
function tree(parent='root',level=0){return S.folders.filter(f=>f.parent===parent&&!f.removed).map(f=>`<button class="${S.folder===f.id?'current':''}" style="padding-left:${level*10+5}px" data-nav="${f.id}">▰ ${esc(f.name)}</button>${tree(f.id,level+1)}`).join('')}
function entries(){if(S.search)return [...S.folders.filter(f=>!f.removed&&folderPath(f.id).toLowerCase().includes(S.search.toLowerCase())).map(f=>({...f,type:'folder'})),...S.assets.filter(a=>!a.removed&&assetPath(a).toLowerCase().includes(S.search.toLowerCase())).map(a=>({...a,type:'asset'}))];return [...S.folders.filter(f=>!f.removed&&f.parent===S.folder).map(f=>({...f,type:'folder'})),...S.assets.filter(a=>!a.removed&&a.folder===S.folder).map(a=>({...a,type:'asset'}))]}
function item(o,list){const isFolder=o.type==='folder',kind=isFolder?'folder':'asset',v=isFolder?null:current(o),meta=isFolder?`${folderAssets(o.id).length} files · recursive`:`v${v.n} · ${o.kind==='doc'?'Frameboard doc':o.kind==='image'?'Image':o.kind==='text'?'Markdown':'Original file'}`;const thumb=isFolder?'<div class="file-icon folder-icon">▰</div>':o.kind==='image'?`<img alt="${esc(o.name)} thumbnail" src="${esc(v.content)}">`:`<div class="file-icon">${o.kind==='file'?(o.name.split('.').at(-1)||'FILE').toUpperCase().slice(0,5):'MD'}</div>`;
const check=`<input class="pick" type="checkbox" aria-label="Select ${esc(o.name)}" data-pick="${o.id}" data-kind="${kind}" ${selected(kind,o.id)?'checked':''}>`;
if(list)return `<div class="file-row" draggable="true" data-drag="${o.id}" data-kind="${kind}">${check}<button class="asset-name" data-open="${o.id}" data-kind="${kind}"><span class="row">${o.kind==='image'?`<img alt="" src="${esc(v.content)}">`:`<span class="mini-icon">${isFolder?'▰':'▤'}</span>`}<span>${esc(o.name)}${S.search?`<small style="display:block">${esc(isFolder?folderPath(o.id):assetPath(o))}</small>`:''}</span></span></button><small>${isFolder?folderAssets(o.id).length+' files':'v'+v.n}</small><button class="plain" data-manage="${o.id}" data-kind="${kind}">Manage</button></div>`;
return `<div class="asset" draggable="true" data-drag="${o.id}" data-kind="${kind}">${thumb}${check}<button class="asset-name" data-open="${o.id}" data-kind="${kind}">${esc(o.name)}</button><span class="asset-meta">${esc(meta)}</span>${S.search?`<small>${esc(isFolder?folderPath(o.id):assetPath(o))}</small>`:''}<button class="plain" style="padding:3px 0;font-size:10px" data-manage="${o.id}" data-kind="${kind}">Manage</button></div>`}

function deliveryPreview(e){return `${S.selections.filter(s=>s.kind==='folder'&&!e.unresolved.includes(s)).map(s=>`<div class="delivery-file"><strong>▰ ${esc(selectionName(s))}</strong><small>${folderAssets(s.id).length} files recursively · current membership at Send</small></div>`).join('')}${e.files.map((f,index)=>{const r=route(f);return `<div class="delivery-file"><strong>${index+1}. Reference · ${esc(f.path)} · v${f.version}</strong><small>${esc(r.error||r.method+' · '+r.detail)}</small><small>From: ${f.origins.map(o=>esc(o.label)).join(' + ')}${f.origins.length>1?' · one input, deduplicated by identity':''}</small>${S.drafts[f.id]!==undefined?'<small>Unsaved draft excluded; saved version only.</small>':''}${f.unknown?'<small>Size impact cannot be reliably estimated. Native attempt may reject it.</small>':''}</div>`}).join('')}${!e.files.length&&!e.unresolved.length?'<p class="notice">No project assets selected.</p>':''}<p class="notice">Reference material is separate from your instructions. Earlier conversation inputs remain after deselection.</p>`}
function composer(){const e=preflight();return `<section class="composer" aria-label="Card prompt composer"><div class="card-kicker">CARD CHAT · THUMBNAIL EXPLORATION</div><h2>A studio that fits on a desk</h2><div class="chat-message">Which part of the video should the thumbnail promise? Add the script and your source images to explore directions.</div><label class="label" for="prompt">Your instructions</label><textarea id="prompt" rows="4">${esc(S.prompt)}</textarea><div class="drop-zone" id="composer-drop"><div class="row between"><strong style="font-size:12px">Project assets</strong><button data-action="open-picker" style="font-size:11px">Choose assets</button></div><p>Drag library files or a whole folder here.</p><div class="selections">${S.selections.map((s,i)=>{const bad=e.unresolved.includes(s),count=s.kind==='folder'&&!bad?folderAssets(s.id).length+' files':'';return `<div class="chip ${bad?'bad':''}"><span>${s.kind==='folder'?'▰':'▤'} ${esc(selectionName(s))} <small>${bad?'Removed · unresolved':count}</small></span><button aria-label="Remove selection ${esc(selectionName(s))}" data-remove-selection="${i}">×</button></div>`}).join('')}</div></div><label class="label" for="provider">${S.temporary?'Temporary override for this prompt':'Primary provider / model'}</label><select class="provider" id="provider">${Object.entries(providers).map(([k,v])=>`<option value="${k}" ${k===S.provider?'selected':''}>${v} · demo model</option>`).join('')}</select><label class="row muted"><input id="temporary" type="checkbox" ${S.temporary?'checked':''}>Temporary prompt override · keep selections</label><details class="preview" id="delivery-preview" ${S.previewOpen?'open':''}><summary>What will be sent · ${e.files.length} unique files</summary>${deliveryPreview(e)}</details>${e.errors.map(x=>`<p class="bad-text">${esc(x)}</p>`).join('')}${e.errors.length?'<p class="notice">The whole submission is blocked. Remove a source selection, enable a usable route, or supply a usable representation.</p>':''}<div class="send-row"><button data-action="fresh">Fresh context</button><button class="primary" data-action="send" ${e.errors.length||!S.prompt.trim()?'disabled':''}>Send</button></div><p class="notice">Demo capabilities only. Send queues an in-memory snapshot; no agent runs.</p>${S.submissions.length?`<button style="margin-top:10px;width:100%" data-action="history">Inspect ${S.submissions.length} frozen submission${S.submissions.length===1?'':'s'}</button>`:''}</section>`}

function render(){const e=expand();$('#root').innerHTML=`<div class="app"><aside class="rail"><div class="brand">Frameboard<b>.</b></div><span class="label">Projects</span><div class="project">Studio channel <small>7 cards</small></div><p class="muted">Weekly newsletter</p><p class="muted">Product launch</p><p class="notice">Prototype projects</p></aside><main><header class="topbar"><small>Workspace / Studio channel</small><span class="prototype-note">Disposable prototype · all changes reset on reload</span></header><div class="head"><h1>Studio channel</h1><div class="tabs"><button data-view="board" class="${S.variant!=='A'?'active':''}">Board</button><button data-view="library" class="${S.variant==='A'?'active':''}">Library</button><button data-action="history">Activity / submissions</button></div></div><div class="scenario"><small>Try an edge case:</small><button data-scenario="folder">Folder + overlapping file</button><button data-scenario="collision">Upload logo.png again</button><button data-scenario="unresolved">Removed selection</button><button data-scenario="empty">Empty folder</button><button data-scenario="limits">Oversized text</button><button data-scenario="missing">Missing retained bytes</button><button data-action="reset">Reset demo</button></div><div class="workspace">${({A:VariantA,B:VariantB,C:VariantC}[S.variant])()}</div><details class="state"><summary>Prototype state · ${esc(S.lastEvent)} · ${e.files.length} resolved files</summary><p>Layout: ${S.variant} · ${variants[S.variant]} · folder: ${esc(folderPath(S.folder)||'/')} · target: ${esc(providers[S.provider])}</p><pre>${esc(JSON.stringify({manualSelections:S.selections,expanded:e.files.map(f=>({assetIdentity:f.id,path:f.path,version:f.version,origins:f.origins})),unresolved:e.unresolved,library:S.assets.map(a=>({id:a.id,path:assetPath(a),removed:!!a.removed,versions:a.versions.map(v=>v.n)})),folders:S.folders,copies:S.copies,submissions:S.submissions.map(s=>({id:s.id,status:s.status,provider:s.provider,files:s.files.map(f=>({id:f.id,path:f.path,version:f.version}))}))},null,2))}</pre></details></main></div><nav class="switcher" aria-label="Prototype variants"><button data-cycle="-1" aria-label="Previous layout">←</button><span><b>${S.variant}</b> · ${variants[S.variant]}</span><button data-cycle="1" aria-label="Next layout">→</button><small>← → to compare</small></nav>`;bind()}
function cycle(delta){const keys=Object.keys(variants);S.variant=keys[(keys.indexOf(S.variant)+delta+3)%3];S.picker=false;const url=new URL(location);url.searchParams.set('variant',S.variant);history.replaceState({},'',url);event('Switched layout; library and selections are unchanged.')}
function show(title,body,foot=''){const m=$('#modal');m.innerHTML=`<div class="row between"><h2>${esc(title)}</h2><button aria-label="Close dialog" data-close>×</button></div><div class="dialog-body">${body}</div><div class="dialog-foot">${foot}</div>`;if(!m.open)m.showModal();m.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>m.close())}
function safeName(name){return name.trim()&&!/[\\/]/.test(name)&&!['.','..'].includes(name)}
function conflict(name,parent,exclude){return S.assets.some(a=>!a.removed&&a.folder===parent&&a.name===name&&a.id!==exclude)||S.folders.some(f=>!f.removed&&f.parent===parent&&f.name===name&&f.id!==exclude)}
function suffix(name,parent){const dot=name.lastIndexOf('.'),base=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'';let n=1;while(conflict(`${base} (${n})${ext}`,parent))n++;return `${base} (${n})${ext}`}
function write(){show('Write or paste a document',`<p class="muted">Save into ${esc(folderPath(S.folder)||'Library root')}. Saving creates its first retained version.</p><label class="field">Filename<input id="new-doc-name" value="untitled.md"></label><label class="field">Content<textarea id="new-doc-content" placeholder="Write here or paste your YouTube script…"></textarea></label><p id="doc-error" class="bad-text"></p>`,`<button data-close>Cancel</button><button class="primary" id="create-doc">Save document</button>`);$('#create-doc').onclick=()=>{const name=$('#new-doc-name').value;if(!safeName(name)){$('#doc-error').textContent='Enter a filename without slashes.';return}const data={name,folder:S.folder,kind:'doc',version:{n:1,content:$('#new-doc-content').value,note:'Written / pasted in Frameboard'}};$('#modal').close();offerUpload(data)}}
function newFolder(){show('Create folder',`<p class="muted">Inside ${esc(folderPath(S.folder)||'Library root')}</p><label class="field">Folder name<input id="folder-name" value="New folder"></label><p id="folder-error" class="bad-text"></p>`,`<button data-close>Cancel</button><button class="primary" id="create-folder">Create folder</button>`);$('#create-folder').onclick=()=>{const name=$('#folder-name').value.trim();if(!safeName(name)||conflict(name,S.folder)){$('#folder-error').textContent='Choose an unused name in this folder, without slashes.';return}S.folders.push({id:'f'+uid++,name,parent:S.folder});$('#modal').close();event('Folder created in '+(folderPath(S.folder)||'Library root'))}}
function details(id,editing=false){const a=asset(id);if(!a)return;const v=current(a);const draft=S.drafts[a.id]??v.content;show(a.name,`<p class="muted">${esc(assetPath(a))} · current v${v.n} · ${a.removed?'Removed from library':'Saved asset'}</p>${a.kind==='image'?`<img class="preview-image" alt="${esc(a.name)}" src="${esc(v.content)}">`:a.kind==='file'?`<div class="empty">▤<h3>No visual preview for this file</h3><p>Download the original or make it available through usable agent tools.</p><small>${esc(v.note)}</small></div>`:editing?`<label class="field">Document draft<textarea id="edit-content">${esc(draft)}</textarea></label><p class="notice" id="draft-note">Only explicit Save changes creates a version. The prompt still uses saved v${v.n}.</p>`:`<pre>${esc(v.content)}</pre>`}<div class="row"><button id="download-original">Download ${a.kind==='file'?'original (demo fixture)':'saved version'}</button>${['doc','text'].includes(a.kind)&&!editing?'<button id="edit-doc">Edit document</button>':''}<button id="replace-original">Replace upload</button><button id="copy-project">Copy to another project</button><button id="manage-open">Rename / move / remove</button></div><div class="versions"><h3>Version history</h3>${a.versions.slice().reverse().map(old=>`<div><small>v${old.n} · ${esc(old.note)}</small><div class="row"><button data-inspect-version="${old.n}">Inspect</button>${old.n!==v.n?`<button data-restore="${old.n}">Restore as new version</button>`:''}</div></div>`).join('')}</div>`,`${editing?'<button id="discard-draft">Discard draft</button><button class="primary" id="save-doc">Save changes</button>':`<button class="primary" id="select-open">Select for prompt</button>`}`);
$('#download-original').onclick=()=>download(a);$('#replace-original').onclick=()=>chooseFiles(a.folder,id);$('#copy-project').onclick=()=>copyProject(a);$('#manage-open').onclick=()=>manage('asset',id);if($('#edit-doc'))$('#edit-doc').onclick=()=>details(id,true);if($('#select-open'))$('#select-open').onclick=()=>{if(a.removed){toast('Removed assets cannot be newly selected.');return}pick('asset',id);$('#modal').close()};if(editing){$('#edit-content').oninput=e=>{S.drafts[id]=e.target.value;$('#draft-note').textContent='Unsaved draft · the next prompt still uses saved v'+v.n;$('#save-doc').disabled=e.target.value===v.content};$('#discard-draft').onclick=()=>{delete S.drafts[id];details(id)};$('#save-doc').disabled=draft===v.content;$('#save-doc').onclick=()=>{a.versions.push({n:v.n+1,kind:a.kind,content:$('#edit-content').value,note:'Explicit document save'});delete S.drafts[id];event('Saved '+a.name+' as v'+current(a).n);details(id)}}
$('#modal').querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const old=a.versions.find(v=>v.n===Number(b.dataset.restore));a.kind=old.kind||a.kind;a.versions.push({...old,n:current(a).n+1,note:'Restored content from v'+old.n});delete S.drafts[id];event('Restored v'+old.n+' as new v'+current(a).n+'. Earlier versions remain.');details(id)});
$('#modal').querySelectorAll('[data-inspect-version]').forEach(b=>b.onclick=()=>{const old=a.versions.find(v=>v.n===Number(b.dataset.inspectVersion));show(a.name+' · v'+old.n,`${old.kind==='image'?`<img class="preview-image" src="${esc(old.content)}" alt="Retained image">`:`<pre>${esc(old.content)}</pre>`}<p class="muted">Retained content · ${esc(old.note)}</p>`,'<button id="back-detail">Back to asset</button>');$('#back-detail').onclick=()=>details(id)})}
function download(a){const v=current(a),anchor=document.createElement('a');anchor.href=a.kind==='image'?v.content:URL.createObjectURL(v.original||new Blob([v.content],{type:a.kind==='file'?'application/octet-stream':'text/markdown'}));anchor.download=a.name;anchor.click();if(a.kind!=='image')setTimeout(()=>URL.revokeObjectURL(anchor.href),5000)}
function manage(kind,id){const o=kind==='folder'?folder(id):asset(id),parent=kind==='folder'?o.parent:o.folder;show('Organize '+o.name,`<label class="field">${kind==='folder'?'Folder name':'Filename'}<input id="rename-value" value="${esc(o.name)}"></label><label class="field">Move to<select id="move-target"><option value="root">Library root</option>${S.folders.filter(f=>!f.removed&&!(kind==='folder'&&under(f.id,id))).map(f=>`<option value="${f.id}" ${f.id===parent?'selected':''}>${esc(folderPath(f.id))}</option>`).join('')}</select></label><p class="notice">Renaming and moving preserve identity, saved versions, and remembered selections. Name conflicts require a different name.</p><p id="organize-error" class="bad-text"></p>`,`<button class="danger" id="remove-source">Remove from library</button><button data-close>Cancel</button><button class="primary" id="save-organize">Save location</button>`);$('#save-organize').onclick=()=>{const name=$('#rename-value').value.trim(),dest=$('#move-target').value;if(!safeName(name)||conflict(name,dest,id)){$('#organize-error').textContent='Choose a different name: this destination already has that name, or the name contains a slash.';return}o.name=name;if(kind==='folder')o.parent=dest;else o.folder=dest;$('#modal').close();event('Location saved. Future selections follow this identity; queued labels stay frozen.')};$('#remove-source').onclick=()=>{show('Remove '+o.name+'?',`<p>This removes ${kind==='folder'?'the folder and its contained assets':'this asset'} from future library selection.</p><p class="muted">Saved versions and queued submissions stay retained. Any remembered explicit selection becomes unresolved.</p>`,`<button id="cancel-remove">Cancel</button><button class="danger" id="confirm-remove">Remove from library</button>`);$('#cancel-remove').onclick=()=>manage(kind,id);$('#confirm-remove').onclick=()=>{if(kind==='folder'){S.folders.filter(f=>under(f.id,id)).forEach(f=>f.removed=true);folderAssets(id).forEach(a=>a.removed=true);if(under(S.folder,id))S.folder='root'}else o.removed=true;$('#modal').close();event('Removed from future library selection. Frozen submissions still keep retained versions.')}}}
function copyProject(a){show('Copy '+a.name,`<label class="field">Destination project<select id="copy-target"><option>Weekly newsletter</option><option>Product launch</option></select></label><p class="muted">Creates an independent asset at the destination’s library root with current v${current(a).n} content only. Previous versions stay in this project.</p>`,'<button data-close>Cancel</button><button class="primary" id="confirm-copy">Create independent copy</button>');$('#confirm-copy').onclick=()=>{const project=$('#copy-target').value;let name=a.name;let index=1;const dot=name.lastIndexOf('.');while(S.copies.some(c=>c.project===project&&c.name===name))name=(dot>0?a.name.slice(0,dot):a.name)+` (${index++})`+(dot>0?a.name.slice(dot):'');S.copies.push({id:'copy'+uid++,project,name,versions:[{...current(a),n:1,note:'Independent current-content copy'}]});event('Copied to '+project+' as a new asset, v1.');show('Copy created',`<p>${esc(project)} / ${esc(name)} · v1</p><p class="muted">This copy has its own identity and one version. Source removal or future edits will not affect it.</p>`,'<button data-close>Done</button>')}}
function removed(){const rs=S.assets.filter(a=>a.removed);show('Removed assets',rs.length?rs.map(a=>`<div class="row between" style="margin:10px 0"><span>${esc(assetPath(a))} · ${a.versions.length} retained versions</span><button data-retained="${a.id}">Inspect retained content</button></div>`).join(''):'<p class="muted">No removed assets. Use Manage on a file or folder to try removal.</p>','<button data-close>Done</button>');$('#modal').querySelectorAll('[data-retained]').forEach(b=>b.onclick=()=>details(b.dataset.retained))}
function offerUpload(data,onDone=()=>{}){data.version.kind=data.kind;const hit=S.assets.find(a=>!a.removed&&a.folder===data.folder&&a.name===data.name);if(!hit&&!conflict(data.name,data.folder)){const a={id:'a'+uid++,name:data.name,folder:data.folder,kind:data.kind,versions:[data.version]};S.assets.push(a);event('Saved '+assetPath(a)+' as a separate asset, v1.');onDone(a);return}const next=suffix(data.name,data.folder);show('A file named '+data.name+' already exists',`<p class="muted">Collision in ${esc(folderPath(data.folder)||'Library root')} only.</p><div class="collision-options"><label><input type="radio" name="collision" value="new" checked><span>Create a separate asset<small>${esc(next)} · new identity · default choice</small></span></label><label><input type="radio" name="collision" value="replace" ${!hit?'disabled':''}><span>Replace the existing asset<small>${hit?`Keep its identity and create v${current(hit).n+1}. Older versions remain.`:'An existing folder cannot be replaced by a file.'}</small></span></label><label><input type="radio" name="collision" value="cancel"><span>Cancel<small>Keep the library unchanged.</small></span></label></div>`,'<button class="primary" id="collision-continue">Create separate asset</button>');$('#modal').querySelectorAll('[name="collision"]').forEach(i=>i.onchange=()=>$('#collision-continue').textContent=({new:'Create separate asset',replace:'Replace and save new version',cancel:'Cancel upload'}[i.value]));$('#collision-continue').onclick=()=>{const choice=$('#modal input[name="collision"]:checked').value;$('#modal').close();if(choice==='cancel'){toast('Upload cancelled.');onDone(null);return}if(choice==='replace'){hit.kind=data.kind;hit.versions.push({...data.version,n:current(hit).n+1});delete S.drafts[hit.id];event('Replaced '+hit.name+'; saved new v'+current(hit).n);onDone(hit)}else{const a={id:'a'+uid++,name:next,folder:data.folder,kind:data.kind,versions:[data.version]};S.assets.push(a);event('Created separate asset '+next);onDone(a)}};$('#modal [data-close]').onclick=()=>{$('#modal').close();onDone(null)};$('#modal').addEventListener('cancel',()=>onDone(null),{once:true})}
function chooseFiles(dest=S.folder,replaceId=null,directory=false){const input=document.createElement('input');input.type='file';input.multiple=!replaceId;if(directory)input.webkitdirectory=true;input.onchange=async()=>{if(replaceId&&input.files[0]){const data=await readFile(input.files[0],dest);const a=asset(replaceId);a.kind=data.kind;a.versions.push({...data.version,n:current(a).n+1});delete S.drafts[a.id];$('#modal').close();event('Replaced '+a.name+' with '+input.files[0].name+' content; new v'+current(a).n);return}await importFiles([...input.files].map(file=>({file,path:file.webkitRelativePath||file.name})),dest)};input.click()}
async function readFile(file,dest){const image=file.type.startsWith('image/'),text=/\.(md|txt|csv|json|js|html|css|yaml|yml|xml)$/i.test(file.name)||file.type.startsWith('text/');return {name:file.name,folder:dest,kind:image?'image':text?'text':'file',version:{n:1,kind:image?'image':text?'text':'file',mime:file.type,content:image?URL.createObjectURL(file):text?await file.text():'Original uploaded file; no visual preview.',original:file,size:file.size,note:'Uploaded original',unknown:!text&&!image}}}
async function importFiles(items,dest){for(const entry of items){let parent=dest;const parts=entry.path.split('/').filter(Boolean);parts.pop();for(const name of parts){let f=S.folders.find(f=>!f.removed&&f.parent===parent&&f.name===name);if(!f){f={id:'f'+uid++,name:conflict(name,parent)?suffix(name,parent):name,parent};S.folders.push(f)}parent=f.id}const data=await readFile(entry.file,parent);await new Promise(resolve=>offerUpload(data,resolve))}render()}
async function readDrop(dataTransfer){const items=[];async function walk(entry,prefix=''){if(entry.isFile){const file=await new Promise(resolve=>entry.file(resolve));items.push({file,path:prefix+file.name})}else if(entry.isDirectory){const reader=entry.createReader();let children;do{children=await new Promise(resolve=>reader.readEntries(resolve));for(const child of children)await walk(child,prefix+entry.name+'/')}while(children.length)}}const entries=[...dataTransfer.items].map(item=>item.webkitGetAsEntry?.()).filter(Boolean);if(entries.length){for(const entry of entries)await walk(entry)}else [...dataTransfer.files].forEach(file=>items.push({file,path:file.name}));return items}
function send(){const e=preflight();if(e.errors.length||!S.prompt.trim())return;const button=$('[data-action="send"]');button.disabled=true;const frozen={id:'submission-'+(S.submissions.length+1),prompt:S.prompt,provider:S.provider,temporary:S.temporary,selections:S.selections.map(s=>({...s,label:selectionName(s)})),files:e.files.map(f=>({...f,origins:f.origins.map(o=>({...o})),delivery:route(f)})),status:'Queued · not delivered',attempts:[]};S.submissions.push(frozen);event('Queued '+frozen.id+'. Exact references are frozen; no native agent runs.');historyDialog()}
function historyDialog(){show('Frozen submissions',S.submissions.length?S.submissions.slice().reverse().map(s=>`<section class="frozen"><div class="row between"><h3>${s.id}</h3><small>${esc(s.status)}</small></div><p class="muted">${esc(providers[s.provider])} · ${s.temporary?'temporary override':'primary target'}</p><details><summary>Exact prompt and reference contents</summary><pre>${esc(s.prompt)}</pre>${s.files.map(f=>`<div class="delivery-file"><strong>Reference · ${esc(f.path)} · captured v${f.version}</strong><small>${esc(f.delivery.method)} · retained input; not yet delivered</small><button data-frozen-download="${s.id}|${f.id}" style="margin-top:6px">Download captured original</button>${f.kind==='image'?`<img style="width:100px" src="${esc(f.content)}" alt="Frozen reference">`:`<pre>${esc(f.content)}</pre>`}</div>`).join('')}<pre>${esc(JSON.stringify({sourceSelections:s.selections,expandedMembership:s.files.map(f=>({id:f.id,path:f.path,version:f.version,origins:f.origins})),attempts:s.attempts},null,2))}</pre></details><div class="row"><button data-attempt="${s.id}">Simulate failed delivery</button><button data-retry="${s.id}">Retry same frozen inputs</button></div><p class="notice">Simulation only. Retry keeps this prompt, target and captured versions. An intentional new Send captures current library state.</p></section>`).join(''):'<p class="muted">Nothing queued yet. Select some assets and Send, then change the library to compare frozen versions with current ones.</p>','<button data-close>Done</button>');$('#modal').querySelectorAll('[data-frozen-download]').forEach(b=>b.onclick=()=>{const [sid,fid]=b.dataset.frozenDownload.split('|'),f=S.submissions.find(s=>s.id===sid).files.find(f=>f.id===fid);download({name:f.name,kind:f.kind,versions:[f]})});$('#modal').querySelectorAll('[data-attempt]').forEach(b=>b.onclick=()=>{const s=S.submissions.find(s=>s.id===b.dataset.attempt);s.attempts.push({n:s.attempts.length+1,outcome:'Demo native rejection; no inputs delivered'});s.status='Failed · not delivered';event('Recorded a simulated failed attempt. Frozen inputs are unchanged.');historyDialog()});$('#modal').querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{const s=S.submissions.find(s=>s.id===b.dataset.retry);s.attempts.push({n:s.attempts.length+1,outcome:'Demo retry queued with original frozen inputs and target'});s.status='Retry queued · not delivered';event('New delivery attempt, same submission and inputs.');historyDialog()})}
function fresh(){show('Start fresh context?',`<p>Start a new conversation within this card chat. Manual asset and folder selections will be cleared.</p><p class="muted">Previous submissions and their captured references stay in history. You must choose assets again.</p>`,'<button data-close>Cancel</button><button class="primary" id="confirm-fresh">Start fresh context</button>');$('#confirm-fresh').onclick=()=>{S.selections=[];$('#modal').close();event('Fresh context started. Manual asset selections cleared.')}}
function changeProvider(value){if(S.temporary){S.provider=value;event('Temporary target changed. Selections retained; delivery routes rechecked.');return}const previous=S.provider;show('Change primary provider / model?',`<p>This starts fresh context and clears manual asset selections.</p><p class="muted">Choose a temporary override to keep this conversation and its selections for one prompt.</p>`,'<button id="cancel-provider">Cancel</button><button class="primary" id="confirm-provider">Change and start fresh context</button>');$('#cancel-provider').onclick=()=>{$('#modal').close();S.provider=previous;render()};$('#confirm-provider').onclick=()=>{S.provider=value;S.primaryProvider=value;S.selections=[];$('#modal').close();event('Primary target changed; fresh context cleared manual selections.')};$('#modal').addEventListener('cancel',()=>render(),{once:true})}
function scenario(which){if(which==='folder'){S.selections=[{kind:'folder',id:'thumbs'},{kind:'asset',id:'logo'},{kind:'asset',id:'script'}];S.folder='thumbs';event('Folder first, overlapping logo second, script third. The logo is supplied once.');return}if(which==='collision'){offerUpload({name:'logo.png',folder:'thumbs',kind:'image',version:{n:1,content:thumbnails.light,note:'Uploaded replacement fixture'}});return}if(which==='empty'){const f=folder('empty');f.removed=false;S.selections=[{kind:'folder',id:'empty'}];S.folder='empty';event('Existing empty folder selected: 0 files; Send is allowed.');return}if(which==='unresolved'){const a=asset('logo');S.selections=[{kind:'asset',id:a.id}];a.removed=true;event('Selected logo removed. A later upload with the same name will not resolve this identity.');return}const id=which==='limits'?'large':'missing';if(!asset(id))S.assets.push({id,name:which==='limits'?'giant-outline.md':'lost-reference.md',folder:'scripts',kind:'text',versions:[{n:1,content:which==='limits'?'Demo oversized text fixture.':'Demo missing retained-content fixture.',size:which==='limits'?400000:60,missing:which==='missing',note:'Delivery-error fixture'}]});S.selections=[{kind:'asset',id}];event(which==='limits'?'Known oversized request: whole Send blocked.':'Missing retained bytes: whole Send blocked.')}
function bind(){document.querySelectorAll('[data-cycle]').forEach(b=>b.onclick=()=>cycle(Number(b.dataset.cycle)));document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.folder=b.dataset.nav;S.search='';render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.variant=b.dataset.view==='library'?'A':'B';const u=new URL(location);u.searchParams.set('variant',S.variant);history.replaceState({},'',u);render()});document.querySelectorAll('[data-pick]').forEach(i=>i.onchange=()=>togglePick(i.dataset.kind,i.dataset.pick,i.checked));document.querySelectorAll('[data-select-folder]').forEach(b=>b.onclick=()=>pick('folder',b.dataset.selectFolder));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(b.dataset.kind==='folder'){S.folder=b.dataset.open;S.search='';render()}else details(b.dataset.open)});document.querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>manage(b.dataset.kind,b.dataset.manage));document.querySelectorAll('[data-remove-selection]').forEach(b=>b.onclick=()=>{S.selections.splice(Number(b.dataset.removeSelection),1);event('Removed this source selection. Earlier conversation inputs remain.')});document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>scenario(b.dataset.scenario));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const action=b.dataset.action;({upload:()=>chooseFiles(),'upload-folder':()=>chooseFiles(S.folder,null,true),write,newFolder,'new-folder':newFolder,removed,send,history:historyDialog,fresh,'open-picker':()=>{if(S.variant!=='B'){$('.library')?.scrollIntoView({behavior:'smooth',block:'center'});return}S.picker=true;render()},'close-picker':()=>{S.picker=false;render()},reset:()=>{const v=S.variant;S=freshSeed();S.variant=v;$('#modal').close();event('Demo reset. All changes were in memory.')}}[action])?.()});
if($('#search'))$('#search').oninput=e=>{const start=e.target.selectionStart;S.search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(start,start)};$('#prompt').oninput=e=>{S.prompt=e.target.value;$('[data-action="send"]').disabled=preflight().errors.length>0||!S.prompt.trim()};$('#provider').onchange=e=>changeProvider(e.target.value);$('#temporary').onchange=e=>{S.temporary=e.target.checked;if(!S.temporary)S.provider=S.primaryProvider;event(S.temporary?'Temporary override enabled. Selections stay remembered.':'Returned to the primary target. Selections retained; delivery routes rechecked.')};$('#delivery-preview').ontoggle=e=>S.previewOpen=e.target.open;
document.querySelectorAll('[data-drag]').forEach(el=>el.ondragstart=e=>{e.dataTransfer.setData('application/x-frameboard-asset',JSON.stringify({kind:el.dataset.kind,id:el.dataset.drag}));e.dataTransfer.effectAllowed='copy';if(S.variant==='B'){// Lift the picker away so a whole folder can be dropped on the composer.
const sheet=$('.picker-backdrop');sheet.style.pointerEvents='none';sheet.style.opacity='.35'} });document.querySelectorAll('[data-drag]').forEach(el=>el.ondragend=()=>{const sheet=$('.picker-backdrop');if(sheet){sheet.style.pointerEvents='';sheet.style.opacity=''}});
const drop=$('#composer-drop');drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();const raw=e.dataTransfer.getData('application/x-frameboard-asset');if(raw){const s=JSON.parse(raw);S.picker=false;pick(s.kind,s.id)}else toast('Upload computer files or folders into the library first, then select them for this prompt.')};const ld=$('#library-drop');if(ld){ld.ondragover=e=>e.preventDefault();ld.ondrop=async e=>{e.preventDefault();if(e.dataTransfer.getData('application/x-frameboard-asset')){toast('Use Manage → Move to organize an existing library asset.');return}const items=await readDrop(e.dataTransfer);await importFiles(items,S.folder)}}}
document.addEventListener('keydown',e=>{if($('#modal').open||e.target.closest('input,textarea,select,[contenteditable]'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
window.addEventListener('popstate',()=>{S.variant=new URLSearchParams(location.search).get('variant')||'C';if(!variants[S.variant])S.variant='C';render()});
render();
</script></body></html>
