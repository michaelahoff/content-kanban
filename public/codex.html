<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex configuration — Frameboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/codex.css">
  <script type="module" src="/codex.js"></script>
</head>
<body>
  <main class="provider-settings">
    <a href="/settings.html" class="text-button">← Back to settings</a>
    <h1>Codex configuration</h1>
    <p id="status" role="status" aria-live="polite">Loading…</p>
    <form id="configuration">
      <div class="settings-heading"><label for="instructions">Your instructions</label><span id="instructions-help"></span></div>
      <textarea id="instructions" rows="6" maxlength="50000" placeholder="Guidance for your Frameboard card chats"></textarea>
      <fieldset><legend>Codex setup <span id="setup-help"></span></legend>
        <label class="native-item"><input type="checkbox" id="inherited">Use my full Codex setup (not isolated)</label>
      </fieldset>
      <fieldset id="isolated-items"><legend>Optional native configuration <span id="native-help"></span></legend>
        <button class="button secondary" id="discover" type="button">Discover installed Codex</button>
        <div id="items"><p>Discover to review instructions, skills and integrations.</p></div>
      </fieldset>
      <button class="button primary" type="submit" id="save" disabled>Save selection</button>
    </form>
    <div id="availability" aria-live="polite"></div>
    <details><summary>Native behavior and permissions</summary><ul id="mandatory"></ul></details>
  </main>
</body>
</html>
