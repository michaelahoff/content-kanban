<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frameboard · Card chat prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#08090c;color:#f0f0f5;font:13px/1.5 'Segoe UI',Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;background:#191a21;border:1px solid #353640;border-radius:6px;padding:6px 10px}button:hover{border-color:#bcb0ff}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:2px solid #bcb0ff;outline-offset:3px}h1,h2,p{margin:0}small,.muted{color:#91939f}textarea{background:#0c0d11;border:1px solid #393541;border-radius:7px;color:#f0f0f5;width:100%;padding:10px;resize:vertical}input,select{color:inherit;background:#191a21;border:1px solid #353640;padding:5px;border-radius:5px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #252730;padding:14px 16px}.brand{font:650 20px 'Avenir Next','Segoe UI',sans-serif;letter-spacing:-.6px}.brand b{color:#bcb0ff}.notice{color:#aaa3bb;font-size:11px;padding:8px 16px;border-bottom:1px solid #252730}.tools{display:flex;gap:6px;flex-wrap:wrap}.primary{background:#bcb0ff;color:#201930}.workspace{position:relative;display:flex;height:580px;min-height:400px}.board{min-width:0;flex:1;overflow:auto;padding:18px}.board-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.board-title h1{font-size:25px;letter-spacing:-.7px}.lanes{display:flex;gap:12px;min-width:410px}.lane{width:210px;flex-shrink:0}.lane h2{font-size:12px;color:#aaa3bb;margin-bottom:12px}.card{background:#111217;border:1px solid #303039;border-radius:9px;overflow:hidden;margin-bottom:12px}.card.selected{border-color:#bcb0ff;box-shadow:0 0 0 1px #bcb0ff}.card-select{border:0;background:transparent;text-align:left;width:100%;padding:0;display:block}.cover{height:95px;display:grid;place-items:center;background:#202335;overflow:hidden}.cover svg{width:100%;height:100%}.card-content{padding:12px}.card-content strong{font-weight:550;display:block;font-size:14px}.card-content p{color:#91939f;font-size:11px;margin:7px 0}.card-foot{display:flex;justify-content:space-between;gap:5px;padding:0 10px 10px;font-size:11px}.state{color:#83bca2}.state.attention{color:#d8b778}.pane{position:relative;display:flex;flex-direction:column;flex:0 0 var(--pane-width,330px);width:var(--pane-width,330px);border-left:1px solid #393541;background:#111217;min-width:260px;max-width:65%;z-index:2}.pane-head{padding:12px;border-bottom:1px solid #252730}.pane-head strong{display:block;font-size:16px;line-height:1.4;margin:7px 0}.pane-top{display:flex;justify-content:space-between;gap:5px}.pane-controls{display:flex;gap:5px;align-items:center;font-size:11px;flex-wrap:wrap}.identity{color:#bcb0ff;font-size:10px}.messages{overflow:auto;flex:1;padding:14px;min-height:90px}.message{margin:0 0 18px;font-size:12px;white-space:pre-wrap}.message b{display:block;color:#91939f;font-size:10px;letter-spacing:.6px;margin-bottom:5px}.message.user{border-left:2px solid #7b6ca2;padding-left:10px}.approval{padding:12px;background:#30271c;border:1px solid #725936;border-radius:7px;margin-bottom:12px}.approval strong{display:block;margin-bottom:6px}.output{border:1px solid #443b59;background:#1e1b28;border-radius:7px;padding:12px;margin-bottom:12px}.output p{margin:7px 0}.composer{border-top:1px solid #252730;padding:12px}.composer textarea{height:78px;min-height:55px}.composer-actions{display:flex;justify-content:space-between;gap:5px;margin-top:6px}.composer-actions>div{display:flex;gap:5px}.attachment{font-size:10px;color:#bcb0ff;margin-bottom:5px}.resize{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:ew-resize;touch-action:none}.editor{position:absolute;inset:20px calc(var(--pane-width,330px) + 12px) 20px 20px;z-index:3;background:#111217;border:1px solid #575060;border-radius:10px;box-shadow:0 20px 90px #000b;display:flex;flex-direction:column;min-width:180px}.editor .fields{padding:16px;overflow:auto}.editor label{display:block;color:#aaa3bb;margin-bottom:8px}.editor textarea{min-height:110px;margin-bottom:16px}.editor h2{font-size:18px}.variant-B .pane{position:absolute;right:0;top:0;bottom:0;box-shadow:-20px 0 50px #0008}.variant-B .board{padding-right:20px}.variant-C .board{flex:0 0 190px;padding:12px}.variant-C .board-title h1{font-size:18px}.variant-C .lanes{display:block;min-width:0}.variant-C .lane{width:100%}.variant-C .cover{height:55px}.variant-C .editing-column{flex:1;background:#0d0e13;padding:15px;overflow:auto;min-width:180px}.editing-column h2{font-size:20px;margin-bottom:15px}.editing-column label{display:block;margin:12px 0 6px;color:#aaa3bb}.editing-column textarea{min-height:120px}.collapsed .pane{display:none}.collapsed .editor{right:20px}.collapsed .editing-column{display:block}.switcher{position:sticky;bottom:8px;display:flex;align-items:center;gap:8px;border:1px solid #6c627d;border-radius:30px;padding:6px 9px;background:#25212f;box-shadow:0 5px 20px #0009;width:max-content;max-width:98%;margin:16px auto;z-index:10}.switcher button{border:0;border-radius:20px}.description{color:#aaa3bb;padding:0 16px 12px;font-size:12px}.lab{padding:12px 16px;border-top:1px solid #252730;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.lab strong{font-size:11px;color:#d8b778}.state-view{margin:0 16px 16px;padding:10px;background:#111217;border:1px solid #252730;font:10px/1.7 monospace;white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:25px;color:#91939f}.image-example{height:65px;border:1px dashed #65597b;padding:8px;margin:8px 0;color:#aaa3bb}button[aria-pressed=true]{border-color:#bcb0ff;color:#bcb0ff}.mobile-return{display:none}.model{max-width:120px;font-size:11px}
@media(max-width:600px){.workspace{height:570px}.pane{position:absolute!important;inset:0!important;width:100%!important;max-width:100%;min-width:0;box-shadow:none!important}.board{width:100%;flex:1!important}.variant-C .editing-column{display:none}.mobile-return{display:inline-block}.editor{inset:0!important;border-radius:0}.resize{display:none}header{padding:12px}.brand{font-size:18px}.notice{font-size:10px}.switcher{font-size:11px}.pane-head strong{font-size:18px}.variant-C .lanes{display:flex;min-width:410px}.variant-C .lane{width:210px}.variant-C .cover{height:95px}.state-view{font-size:9px}}
</style></head><body><header><div class="brand">Frameboard<b>.</b></div><div class="tools"><button id="toggle">Collapse chat</button><button id="edit">Edit card</button></div></header><div class="notice">INTERACTION PROTOTYPE · In-memory examples · Agent replies, approvals and images are simulated</div><div id="workspace"></div><div class="lab"><strong>TRY A SCENARIO</strong><button data-scenario="running">Reply running</button><button data-scenario="approval">Approval needed</button><button data-scenario="image">Image result</button><button data-scenario="complete">Finish reply</button><button data-scenario="background">Finish other cards</button><button data-scenario="error">Connection lost</button><button data-scenario="empty">No selection</button></div><div class="switcher"><button id="prev" aria-label="Previous layout">←</button><span id="variant-label"></span><button id="next" aria-label="Next layout">→</button></div><p class="description" id="description"></p><pre class="state-view" id="state-view"></pre><script>
const names={A:'Docked panel',B:'Overlay drawer',C:'Editing workbench'};
const descriptions={A:'A · Board shrinks beside a resizable chat. Click selects a card; Edit opens a separate editor beside chat.',B:'B · Chat overlays the right edge, keeping lane widths unchanged. The editor and drawer remain separate surfaces.',C:'C · Compact board at left, writing in the middle, card chat at right. Selection reveals both writing and conversation.'};
const cards=[{id:'forest',title:'A slower morning',lane:'Ideas',intro:'A quiet walk before the day begins.',color:'#33463d'},{id:'studio',title:'Inside the editing room',lane:'Writing',intro:'How a rough idea becomes a finished story.',color:'#3b324d'},{id:'light',title:'Finding the last light',lane:'Writing',intro:'A short film about noticing what is already there.',color:'#54402c'}];
const chats=Object.fromEntries(cards.map(c=>[c.id,{draft:'',attachment:false,scroll:0,status:'Ready',unread:false,messages:[{role:'You',text:'Help me find an opening for “'+c.title+'”.'},{role:'Codex',text:'Start with one specific moment. Let the audience experience the scene before you explain the idea.'}],output:false,approval:false,image:false}]));
const state={variant:new URLSearchParams(location.search).get('variant')||'A',selected:'forest',collapsed:false,editor:false,width:330};if(!names[state.variant])state.variant='A';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const selected=()=>cards.find(c=>c.id===state.selected);const chat=()=>chats[state.selected];
function art(c){return '<svg viewBox="0 0 210 95" aria-hidden="true"><rect width="210" height="95" fill="'+c.color+'"/><path d="M0 90 L45 30 L80 70 L130 10 L210 95" fill="#ffffff15"/><circle cx="165" cy="24" r="13" fill="#e7decf70"/><path d="M0 95 Q70 20 210 80 V95" fill="#08090c44"/></svg>'}
function cardMarkup(c){const ch=chats[c.id];return '<article class="card '+(state.selected===c.id?'selected':'')+'"><button class="card-select" data-select="'+c.id+'" aria-pressed="'+(state.selected===c.id)+'"><div class="cover">'+art(c)+'</div><div class="card-content"><strong>'+esc(c.title)+'</strong><p>'+esc(c.intro)+'</p></div></button><div class="card-foot"><span class="state '+(ch.approval?'attention':'')+'">'+esc(ch.approval?'Needs approval':ch.unread?'New reply':ch.status)+'</span><button data-edit="'+c.id+'">Edit</button></div></article>'}
function fields(){const c=selected();return '<label>Intro</label><textarea data-field="intro">'+esc(c.intro)+'</textarea><label>Script</label><textarea data-field="script">'+esc(c.script||'Begin with the scene. Let the first image carry the story.')+'</textarea><small>Edits stay in this prototype only.</small>'}
function paneMarkup(){const c=selected();if(!c)return '<aside class="pane"><div class="empty">Select a card to open its conversation. Each card has one chat.</div></aside>';const ch=chat();return '<aside class="pane" aria-label="Card chat"><div class="resize" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize chat" aria-valuemin="260" aria-valuemax="520" aria-valuenow="'+state.width+'"></div><div class="pane-head"><div class="pane-top"><span class="identity">CARD CHAT · '+esc(c.lane)+'</span><button class="mobile-return" id="back">← Board</button><button id="close" aria-label="Collapse chat">×</button></div><strong>'+esc(c.title)+'</strong><div class="pane-controls"><select class="model" aria-label="Agent"><option>Codex · Native</option><option disabled>Claude · Not connected</option></select><span class="state '+(ch.approval?'attention':'')+'">'+esc(ch.status)+'</span></div></div><div class="messages" id="messages">'+ch.messages.map(m=>'<div class="message '+(m.role==='You'?'user':'')+'"><b>'+esc(m.role)+'</b>'+esc(m.text)+'</div>').join('')+(ch.approval?'<div class="approval"><strong>Allow the requested action?</strong><p>This request belongs to “'+esc(c.title)+'”.</p><small>Example: read a local reference file.</small><div class="tools"><button data-approval="allow">Allow once</button><button data-approval="deny">Deny</button></div></div>':'')+(ch.output?'<div class="output"><small>Selected output · Intro</small><p>A day begins long before the noise does.</p><button id="review">Review for this card</button></div>':'')+(ch.image?'<div class="output"><strong>Generated image · Version 1</strong><div class="image-example">Simulated image artifact</div><button id="reference">Use as edit reference</button> <button id="image-review">Review image</button></div>':'')+'</div><div class="composer">'+(ch.attachment?'<div class="attachment">Reference image attached <button id="remove-reference" aria-label="Remove reference">×</button></div>':'')+'<textarea id="draft" aria-label="Prompt for '+esc(c.title)+'" placeholder="Continue this card’s conversation…">'+esc(ch.draft)+'</textarea><div class="composer-actions"><button id="attach">＋ Image</button><div><button id="stop" '+(ch.status==='Running'?'':'disabled')+'>Stop</button><button class="primary" id="send" '+(ch.status==='Running'||ch.approval?'disabled':'')+'>Send</button></div></div></div></aside>'}
function saveView(){const m=document.getElementById('messages');if(m&&chat())chat().scroll=m.scrollTop}
function displayState(){document.getElementById('state-view').textContent='Selected: '+(state.selected||'none')+' · Layout: '+state.variant+' · Chat: '+(state.collapsed?'collapsed':'open')+' · Width: '+state.width+'px\n'+cards.map(c=>c.title+': '+chats[c.id].status+' | draft '+JSON.stringify(chats[c.id].draft)+' | reference '+chats[c.id].attachment+' | unread '+chats[c.id].unread+' | scroll '+Math.round(chats[c.id].scroll)).join('\n')}
function render(){const c=selected();document.getElementById('workspace').className='workspace variant-'+state.variant+(state.collapsed?' collapsed':'');document.getElementById('workspace').style.setProperty('--pane-width',state.width+'px');document.getElementById('workspace').innerHTML='<main class="board"><div class="board-title"><div><small>PERSONAL WORKSPACE</small><h1>Content studio</h1></div></div><div class="lanes">'+['Ideas','Writing'].map(l=>'<section class="lane"><h2>'+l+' · '+cards.filter(c=>c.lane===l).length+'</h2>'+cards.filter(c=>c.lane===l).map(cardMarkup).join('')+'</section>').join('')+'</div></main>'+(state.variant==='C'?'<section class="editing-column">'+(c?'<small>WRITING · '+esc(c.lane)+'</small><h2>'+esc(c.title)+'</h2>'+fields():'Select a card to edit its content.')+'</section>':'')+paneMarkup()+(state.editor&&c&&(state.variant!=='C'||innerWidth<=600)?'<section class="editor" aria-label="Card editor"><header><h2>'+esc(c.title)+'</h2><button id="close-editor">Done</button></header><div class="fields">'+fields()+'</div></section>':'');document.getElementById('toggle').textContent=state.collapsed?'Open chat':'Collapse chat';document.getElementById('variant-label').textContent=state.variant+' · '+names[state.variant];document.getElementById('description').textContent=descriptions[state.variant];const m=document.getElementById('messages');if(m&&chat())m.scrollTop=chat().scroll;displayState()}
function select(id,editing=false){saveView();state.selected=id;chats[id].unread=false;state.collapsed=false;state.editor=editing;render()}
function variant(delta){saveView();const keys=Object.keys(names);state.variant=keys[(keys.indexOf(state.variant)+delta+3)%3];state.editor=false;const url=new URL(location.href);url.searchParams.set('variant',state.variant);history.replaceState(null,'',url);render()}
document.addEventListener('input',e=>{if(e.target.id==='draft'){chat().draft=e.target.value;displayState()}if(e.target.dataset.field&&selected()){selected()[e.target.dataset.field]=e.target.value;displayState()}});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.target.classList.contains('resize')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();saveView();state.width=Math.max(260,Math.min(520,state.width+(e.key==='ArrowLeft'?20:-20)));render();document.querySelector('.resize').focus();return}if(e.key==='ArrowLeft')variant(-1);if(e.key==='ArrowRight')variant(1);if(e.key==='Escape'){state.editor=false;render()}});
document.addEventListener('pointerdown',e=>{if(!e.target.classList.contains('resize'))return;const start=e.clientX,w=state.width;e.target.setPointerCapture(e.pointerId);const move=ev=>{state.width=Math.max(260,Math.min(520,w+start-ev.clientX));document.getElementById('workspace').style.setProperty('--pane-width',state.width+'px');e.target.setAttribute('aria-valuenow',state.width);displayState()};e.target.addEventListener('pointermove',move);e.target.addEventListener('pointerup',()=>e.target.removeEventListener('pointermove',move),{once:true})});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.select)return select(b.dataset.select);if(b.dataset.edit)return select(b.dataset.edit,true);saveView();const ch=chat();if(b.id==='prev')return variant(-1);if(b.id==='next')return variant(1);if(['toggle','close','back'].includes(b.id))state.collapsed=!state.collapsed;if(b.id==='edit'&&selected()){state.editor=true;state.collapsed=false}if(b.id==='close-editor')state.editor=false;if(b.id==='send'&&ch&&ch.draft.trim()){ch.messages.push({role:'You',text:ch.draft});ch.draft='';ch.status='Running';ch.messages.push({role:'Codex',text:'Finding a concrete opening… (simulated partial reply)'});ch.scroll=1e6}if(b.id==='stop'&&ch){ch.status='Stopped';ch.messages.push({role:'System',text:'Stopped. Partial reply retained.'})}if(b.id==='attach'&&ch)ch.attachment=true;if(b.id==='remove-reference'&&ch)ch.attachment=false;if(b.id==='reference'&&ch){ch.attachment=true;ch.draft='Edit this image: ' }if(b.dataset.approval&&ch){ch.approval=false;ch.status=b.dataset.approval==='allow'?'Running':'Stopped';ch.messages.push({role:'System',text:b.dataset.approval==='allow'?'Allowed once.':'Request denied.'})}if(b.id==='review'&&selected()){document.getElementById('review-title').textContent='Apply to “'+selected().title+'”?';document.getElementById('review-dialog').showModal();return}if(b.id==='apply'&&selected()){selected().intro='A day begins long before the noise does.';ch.messages.push({role:'System',text:'Applied selected output to this card’s Intro (simulation).'});document.getElementById('review-dialog').close()}if(b.id==='cancel-review')document.getElementById('review-dialog').close();if(b.id==='image-review'&&ch){ch.messages.push({role:'System',text:'Image review would show the artifact and let you choose its role. Detailed adoption is a later decision.'})}if(b.dataset.scenario){if(b.dataset.scenario==='background'){for(const c of cards){if(c.id!==state.selected&&chats[c.id].status==='Running'){chats[c.id].status='Ready';chats[c.id].output=true;chats[c.id].unread=true}}}else if(b.dataset.scenario==='empty'){state.selected=null;state.editor=false}else if(ch){const s=b.dataset.scenario;if(s==='running'){ch.status='Running';ch.messages.push({role:'Codex',text:'Building an opening around a specific moment…'});}if(s==='approval'){ch.status='Needs approval';ch.approval=true}if(s==='image'){ch.image=true;ch.status='Ready'}if(s==='complete'){ch.status='Ready';ch.output=true;ch.approval=false;ch.messages.push({role:'Codex',text:'A day begins long before the noise does.'})}if(s==='error'){ch.status='Disconnected';ch.messages.push({role:'System',text:'Connection lost. Partial messages remain. Reconnection behavior is a later decision.'})}}}render()});
// Background completion demonstrates activity badges without changing the selected card.
window.prototypeFinishBackground=id=>{if(!chats[id])return;chats[id].status='Ready';chats[id].output=true;chats[id].unread=id!==state.selected;render()};
render();console.log('Prototype initialized: three layouts; card draft, scroll, attachments and run state are independent.');
</script><dialog id="review-dialog" style="background:#191a21;color:#f0f0f5;border:1px solid #665d78;border-radius:9px;max-width:90%;padding:20px"><h2 id="review-title" style="font-size:18px"></h2><p style="margin:14px 0">Replace Intro with: “A day begins long before the noise does.”</p><button id="cancel-review">Cancel</button> <button id="apply" class="primary">Apply to Intro</button></dialog></body></html>
